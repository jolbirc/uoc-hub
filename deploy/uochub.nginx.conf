# nginx server block for UOCHub.
# Install: sudo cp deploy/uochub.nginx.conf /etc/nginx/sites-available/uochub.birchdigital.uk
#          sudo ln -s /etc/nginx/sites-available/uochub.birchdigital.uk /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then let certbot add HTTPS: sudo certbot --nginx -d uochub.birchdigital.uk
# (certbot rewrites this file in place to add the 443/ssl block and the
# port-80 redirect, same as it did for menuone.birchdigital.uk)

server {
    listen 80;
    server_name uochub.birchdigital.uk;

    # No uploads yet; keep request bodies small
    client_max_body_size 1m;

    location /static/ {
        alias /var/www/uochub/uochub/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/uochub/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
