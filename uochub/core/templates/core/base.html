{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | UOCHub</title>
    <link rel="stylesheet" href="{% static 'styles/main.css' %}">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-user">
            <img class="avatar" src="{% static 'icons/user-dummy-pfp.svg' %}" alt="Profile picture">
            {% if user.is_authenticated %}<span class="sidebar-username">{{ user.username }}</span>{% endif %}
        </div>
        <a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>
            <img class="nav-icon" src="{% static 'icons/home.svg' %}" alt=""> Home
        </a>
        <a href="{% url 'profile' %}" {% if request.resolver_match.url_name == 'profile' %}class="active"{% endif %}>
            <img class="nav-icon" src="{% static 'icons/profile.svg' %}" alt=""> Profile
        </a>
        <a href="{% url 'campus-map' %}" {% if request.resolver_match.url_name == 'campus-map' %}class="active"{% endif %}>
            <img class="nav-icon" src="{% static 'icons/campus-map.svg' %}" alt=""> Campus Map
        </a>
        <form class="logout-form" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
    </nav>
    <div class="content">
        <header class="topbar">
            <span class="topbar-text">{% block header_text %}{% endblock %}</span>
            <img class="logo" src="{% static 'img/logo.png' %}" alt="UOCHub">
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
